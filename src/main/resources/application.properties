spring.application.name=mqproxy
server.port=8080

# ---------------------------------------------------------------------------
# MQ proxy defaults
# ---------------------------------------------------------------------------

# how long to wait for the reply (correlation id = request msgId)
mq.reply-timeout-ms=30000

# optional default credentials; leave empty for anonymous (local) queue managers
# mq.user/mq.password are only sent when a user id is present
mq.user=
mq.password=

# used only when the mq_queue / mq_reply_queue headers are missing
mq.request-queue=
mq.reply-queue=

# when no reply queue is given, a temporary dynamic queue is created from this
# model queue and deleted again after the call
mq.model-queue=SYSTEM.DEFAULT.MODEL.QUEUE
mq.dynamic-queue-name=MQPROXY.REPLY.*

# allow reasonably large JSON payloads / replies
spring.codec.max-in-memory-size=10MB

# keep the console readable: only our proxy logs + warnings
logging.level.root=INFO
logging.level.com.adicha.mqproxy=INFO
logging.level.com.ibm=WARN
