spring.application.name=mqproxy
server.port=8080

# ---------------------------------------------------------------------------
# MQ defaults - these are only used when the matching HTTP header is missing
# ---------------------------------------------------------------------------

# empty = use the local queue manager in bindings mode: new MQQueueManager(qmName)
mq.host=
mq.port=1414
mq.channel=
mq.queue-manager=

# empty = anonymous connection, the channel's MCAUSER / CHLAUTH decides
mq.user=
mq.password=

# request queue to put to, reply queue to read from
# (reply queue empty = temporary dynamic queue, deleted after the call)
mq.request-queue=
mq.reply-queue=

# how long to wait for the reply (correlation id = request msgId)
mq.reply-timeout-ms=30000

# model queue + name used for the temporary dynamic reply queue
mq.model-queue=SYSTEM.DEFAULT.MODEL.QUEUE
mq.dynamic-queue-name=MQPROXY.REPLY.*

# allow reasonably large JSON payloads / replies
spring.codec.max-in-memory-size=10MB

# keep the console readable: only our proxy logs + warnings
logging.level.root=INFO
logging.level.com.adicha.mqproxy=INFO
logging.level.com.ibm=WARN
